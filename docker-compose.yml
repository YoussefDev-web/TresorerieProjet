version: '3.8'

services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: tresorie-mysql
    environment:
      MYSQL_DATABASE: tresorerie_db
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Application Spring Boot
  app:
    build: .
    container_name: tresorie-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # Surcharge l'URL de la base de données pour utiliser le conteneur 'db'
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/tresorerie_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=

volumes:
  mysql_data:
