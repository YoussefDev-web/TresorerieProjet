<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Caisses — Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #14202b;
            font-family: 'IBM Plex Sans', sans-serif;
            color: #c8daea;
            min-height: 100vh
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px
        }

        ::-webkit-scrollbar-track {
            background: #14202b
        }

        ::-webkit-scrollbar-thumb {
            background: #2a4155;
            border-radius: 3px
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid #1e3245;
            background: #0f1e2b
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4fa8e8;
            box-shadow: 0 0 6px #4fa8e8
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .1em;
            color: #4fa8e8
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .back-btn {
            background: #223347;
            border: 1px solid #2a4155;
            color: #b0cde0;
            padding: 6px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            transition: background .15s
        }

        .back-btn:hover {
            background: #2a4155
        }

        .logout-btn {
            background: #4a1a1a;
            border: 1px solid #7f1d1d55;
            color: #f87171;
            padding: 6px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s
        }

        .logout-btn:hover {
            background: #6a1a1a
        }

        /* ── Alerts ── */
        .alert {
            margin: 12px 20px 0;
            padding: 9px 14px;
            border-radius: 4px;
            font-size: 12.5px
        }

        .alert-success {
            background: #14532d22;
            border: 1px solid #14532d;
            color: #4ade80
        }

        .alert-error {
            background: #7f1d1d22;
            border: 1px solid #7f1d1d;
            color: #f87171
        }

        /* ── Page header ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 0
        }

        .page-header h2 {
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0
        }

        .badge {
            background: #1a3a5a;
            border: 1px solid #2a5a8a;
            color: #4fa8e8;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-family: 'IBM Plex Mono', monospace
        }

        /* ── Bouton Ajouter ── */
        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1a5c38;
            border: 1px solid #2a8a58;
            color: #6effa8;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 600;
            transition: background .15s;
            margin: 14px 20px 0
        }

        .add-btn:hover {
            background: #226a42
        }

        /* ── Tableau ── */
        .table-wrap {
            margin: 14px 20px 32px;
            border: 1px solid #2a4155;
            border-radius: 5px;
            overflow-x: auto
        }

        .caisses-tbl {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        .caisses-tbl thead tr {
            background: #1b2d3d
        }

        .caisses-tbl thead th {
            padding: 10px 14px;
            text-align: left;
            color: #7fa3be;
            font-weight: 600;
            font-size: 11px;
            border-bottom: 2px solid #2a4155;
            border-right: 1px solid #2a4155;
            white-space: nowrap
        }

        .caisses-tbl thead th:last-child {
            border-right: none
        }

        .caisses-tbl tbody tr {
            border-bottom: 1px solid #1e3245;
            transition: background .1s
        }

        .caisses-tbl tbody tr:nth-child(even) {
            background: #1b2d3d
        }

        .caisses-tbl tbody tr:nth-child(odd) {
            background: #14202b
        }

        .caisses-tbl tbody tr:hover {
            background: #1e3345 !important
        }

        .caisses-tbl tbody td {
            padding: 9px 14px;
            border-right: 1px solid #1e3245;
            color: #c8daea
        }

        .caisses-tbl tbody td:last-child {
            border-right: none
        }

        .td-id {
            color: #4fa8e8;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            width: 44px
        }

        .td-nom {
            color: #e2f0ff;
            font-weight: 500
        }

        .td-montant {
            font-family: 'IBM Plex Mono', monospace;
            text-align: right;
            white-space: nowrap
        }

        .montant-positif {
            color: #4ade80
        }

        .montant-negatif {
            color: #f87171
        }

        .montant-neutre {
            color: #c8daea
        }

        /* ── Actions ── */
        .del-form {
            display: inline
        }

        .del-btn {
            background: transparent;
            border: 1px solid #7f1d1d55;
            color: #f87171;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: background .1s
        }

        .del-btn:hover {
            background: #7f1d1d22
        }

        .del-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #4a6a82;
            font-size: 12.5px
        }

        .empty-state span {
            font-size: 32px;
            display: block;
            margin-bottom: 10px
        }

        /* ── Info box ── */
        .info-box {
            margin: 0 20px 0;
            background: #1a3a5a22;
            border: 1px solid #2a5a8a44;
            border-left: 3px solid #4fa8e8;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 11.5px;
            color: #7fa3be;
            line-height: 1.7
        }

        .info-box strong {
            color: #4fa8e8
        }

        /* ── Badge centrale ── */
        .badge-centrale {
            background: #1a3a5a;
            color: #4fa8e8;
            border: 1px solid #2a5a8a55;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="dot"></div>
            <h1>🏦 GESTION DES CAISSES</h1>
        </div>
        <div class="header-right">
            <a href="/flux-tresorerie" class="back-btn">← Tableau de bord</a>
            <a href="/admin/utilisateurs" class="back-btn">👥 Utilisateurs</a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-btn">⏻ Déconnexion</button>
            </form>
        </div>
    </div>

    <div th:if="${succes}" class="alert alert-success" th:text="${succes}"></div>
    <div th:if="${erreur}" class="alert alert-error" th:text="${erreur}"></div>

    <!-- Page header -->
    <div class="page-header">
        <h2>Caisses de trésorerie</h2>
        <span class="badge" th:text="${#lists.size(caisses)} + ' caisse(s)'">0 caisse(s)</span>
    </div>

    <!-- Bouton ajouter -->
    <a href="/admin/caisses/nouvelle" class="add-btn">➕ Ajouter une caisse</a>

    <!-- Tableau -->
    <div class="table-wrap">
        <table class="caisses-tbl">
            <thead>
                <tr>
                    <th class="td-id">#</th>
                    <th>Nom</th>
                    <th>Encaissement</th>
                    <th>Décaissement</th>
                    <th>Créance</th>
                    <th>Dette</th>
                    <th>Cash Disponible</th>
                    <th style="width:80px">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${caisses}">
                    <td class="td-id" th:text="${c.id}">—</td>
                    <td class="td-nom">
                        <span th:text="${c.nom}">—</span>
                        <span th:if="${#strings.equalsIgnoreCase(c.nom, 'caisse centrale')}" class="badge-centrale">🌐
                            Centrale</span>
                    </td>
                    <td class="td-montant montant-positif"
                        th:text="${c.encaissement != null ? #numbers.formatDecimal(c.encaissement, 1, 'COMMA', 2, 'POINT') + ' dh' : '0,00 dh'}">
                        0,00 dh</td>
                    <td class="td-montant montant-negatif"
                        th:text="${c.decaissement != null ? #numbers.formatDecimal(c.decaissement, 1, 'COMMA', 2, 'POINT') + ' dh' : '0,00 dh'}">
                        0,00 dh</td>
                    <td class="td-montant montant-neutre"
                        th:text="${c.creance != null ? #numbers.formatDecimal(c.creance, 1, 'COMMA', 2, 'POINT') + ' dh' : '0,00 dh'}">
                        0,00 dh</td>
                    <td class="td-montant montant-neutre"
                        th:text="${c.dette != null ? #numbers.formatDecimal(c.dette, 1, 'COMMA', 2, 'POINT') + ' dh' : '0,00 dh'}">
                        0,00 dh</td>
                    <td class="td-montant"
                        th:classappend="${c.cashDisponible != null && c.cashDisponible >= 0} ? 'montant-positif' : 'montant-negatif'"
                        th:text="${c.cashDisponible != null ? #numbers.formatDecimal(c.cashDisponible, 1, 'COMMA', 2, 'POINT') + ' dh' : '0,00 dh'}">
                        0,00 dh</td>
                    <td>
                        <form class="del-form" th:action="@{/admin/caisses/supprimer/{id}(id=${c.id})}" method="post"
                            onsubmit="return confirm('Supprimer cette caisse ? Les opérations associées ne seront pas supprimées.')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="del-btn"
                                th:disabled="${#strings.equalsIgnoreCase(c.nom, 'caisse centrale')}"
                                th:title="${#strings.equalsIgnoreCase(c.nom, 'caisse centrale') ? 'La caisse centrale ne peut pas être supprimée' : 'Supprimer cette caisse'}">🗑️</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(caisses)}">
                    <td colspan="8" style="padding:0;border:none">
                        <div class="empty-state">
                            <span>🏦</span>
                            Aucune caisse enregistrée.
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
