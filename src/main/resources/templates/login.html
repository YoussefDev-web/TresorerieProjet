<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Trésorerie Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            /* Dark background */
            color: #d1d5db;
            /* Light text */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Minimalist Dark Card ── */
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .login-card {
            background: #1f2937;
            /* Dark card */
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            border: 1px solid #374151;
            /* Dark border */
        }

        /* ── Header ── */
        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container {
            width: 48px;
            height: 48px;
            margin: 0 auto 1rem;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #10b981;
        }

        .card-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        /* ── Form Fields ── */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #e5e7eb;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            display: flex;
        }

        .form-control {
            width: 100%;
            background: #374151;
            /* Dark input */
            border: 1px solid #4b5563;
            /* Dark border */
            border-radius: 8px;
            padding: 0.625rem 1rem 0.625rem 2.5rem;
            color: #f9fafb;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            background: #1f2937;
        }

        .form-control:focus+.input-icon {
            color: #10b981;
        }

        /* ── Alerts ── */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-error {
            background: rgba(153, 27, 27, 0.2);
            border: 1px solid rgba(153, 27, 27, 0.4);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(6, 95, 70, 0.2);
            border: 1px solid rgba(6, 95, 70, 0.4);
            color: #6ee7b7;
        }

        /* ── Submit Button ── */
        .btn-submit {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #059669;
        }

        .btn-submit:active {
            background: #047857;
        }

        /* ── Footer ── */
        .card-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Header -->
            <div class="card-header">
                <div class="logo-container">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                        <circle cx="12" cy="12" r="2"></circle>
                        <path d="M6 12h.01M18 12h.01"></path>
                    </svg>
                </div>
                <h1>Trésorerie</h1>
                <p>Connectez-vous à votre espace</p>
            </div>

            <!-- Alerts -->
            <div th:if="${param.error}" class="alert alert-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>Identifiant ou mot de passe incorrect.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Vous avez été déconnecté avec succès.</span>
            </div>

            <!-- Form -->
            <form th:action="@{/login}" method="post">

                <div class="form-group">
                    <label for="username">Identifiant</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <input id="username" type="text" name="username" class="form-control"
                            placeholder="Entrez votre identifiant" required autofocus />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input id="password" type="password" name="password" class="form-control" placeholder="••••••••"
                            required />
                    </div>
                </div>

                <!-- CSRF token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button type="submit" class="btn-submit">
                    Se connecter
                </button>

            </form>



        </div>
    </div>

</body>

</html>
